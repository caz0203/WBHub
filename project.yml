name: WBHub
options:
  bundleIdPrefix: com.xiaoshuai
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO

targets:
  WBHub:
    type: application
    platform: iOS
    sources:
      - path: WBHub
        excludes:
          - "Info.plist"
          - "WBHub.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaoshuai.wbhub
        PRODUCT_NAME: WBHub
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: WBHub/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: WBHub/WBHub.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        ENABLE_BITCODE: NO
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
    info:
      path: WBHub/Info.plist
      properties:
        CFBundleDisplayName: WB Hub
        CFBundleShortVersionString: "1.0.2"
        CFBundleVersion: "3"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: 需要局域网权限，供同一 Wi-Fi 下的客户端连接本地反代。
        UIBackgroundModes:
          - audio
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.xiaoshuai.wbhub.keepalive
          - com.xiaoshuai.wbhub.refresh
          - com.xiaoshuai.wbhub.task
        ITSAppUsesNonExemptEncryption: false
