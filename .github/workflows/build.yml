name: Build unsigned IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_15.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Build (arm64, unsigned)
        run: |
          set -e
          xcodebuild \
            -project WBHub.xcodeproj \
            -scheme WBHub \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Package Payload
        run: |
          set -e
          APP="build/Build/Products/Release-iphoneos/WBHub.app"
          test -d "$APP"
          rm -rf Payload WBHub.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          rm -rf Payload/WBHub.app/_CodeSignature
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName WB Hub" Payload/WBHub.app/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 15.0" Payload/WBHub.app/Info.plist || true
          zip -qry WBHub.ipa Payload
          ls -lh WBHub.ipa
          unzip -l WBHub.ipa | head -20

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WBHub-unsigned-ipa
          path: WBHub.ipa
          retention-days: 30
