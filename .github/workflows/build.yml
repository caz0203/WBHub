name: Build unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos | head -3
          uname -m

      - name: Build (arm64, unsigned)
        run: |
          set -e
          xcodebuild \
            -project WBHub.xcodeproj \
            -scheme WBHub \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Package Payload
        run: |
          set -e
          APP="build/Build/Products/Release-iphoneos/WBHub.app"
          test -d "$APP" || { echo "missing $APP"; ls -R build/Build/Products | head -40; exit 1; }
          rm -rf Payload WBHub.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          rm -rf Payload/WBHub.app/_CodeSignature
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName WB Hub" Payload/WBHub.app/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 15.0" Payload/WBHub.app/Info.plist || true
          zip -qry WBHub.ipa Payload
          ls -lh WBHub.ipa
          unzip -l WBHub.ipa | head -25

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WBHub-unsigned-ipa
          path: WBHub.ipa
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/Logs
          if-no-files-found: ignore
