name: Build unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          uname -m
          sw_vers

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          pwd
          ls -la
          xcodegen generate --spec project.yml
          ls -la WBHub.xcodeproj

      - name: Build arm64 unsigned
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild \
            -project WBHub.xcodeproj \
            -scheme WBHub \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            build 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Report errors
        if: steps.build.outcome == 'failure'
        run: |
          {
            echo "# CI build errors"
            echo ""
            echo '```'
            grep -E "error:|fatal error|BUILD FAILED|The following build commands failed|SpecValidation" build.log | sort -u | head -100
            echo '```'
            echo ""
            echo "## tail 150"
            echo '```'
            tail -150 build.log
            echo '```'
          } > CI-ERRORS.md

      - name: Upload error report
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ci-errors
          path: CI-ERRORS.md

      - name: Package Payload
        if: steps.build.outcome == 'success'
        run: |
          set -e
          APP="build/Build/Products/Release-iphoneos/WBHub.app"
          test -d "$APP"
          rm -rf Payload WBHub.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          rm -rf Payload/WBHub.app/_CodeSignature
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName WB Hub" Payload/WBHub.app/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 15.0" Payload/WBHub.app/Info.plist || true
          zip -qry WBHub.ipa Payload
          ls -lh WBHub.ipa
          unzip -l WBHub.ipa | head -25

      - name: Upload IPA
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: WBHub-unsigned-ipa
          path: WBHub.ipa
          retention-days: 30

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
